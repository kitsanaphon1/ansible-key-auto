- hosts: all
  become: true
  vars:
    compose_path: /home/azureuser/app  # <- ปรับ path ตรงนี้ตามที่คุณเก็บ docker-compose.yaml

  tasks:
    - name: 📦 ตรวจสอบว่า docker-compose.yaml มีอยู่
      stat:
        path: "{{ compose_path }}/docker-compose.yaml"
      register: compose_file

    - name: ❌ แจ้งเตือนหากไม่มี docker-compose.yaml
      fail:
        msg: "❌ ไม่พบ docker-compose.yaml ที่ {{ compose_path }}"
      when: not compose_file.stat.exists

    - name: 🐳 รัน docker compose up -d
      shell: docker compose -f docker-compose.yaml up -d
      args:
        chdir: "{{ compose_path }}"
