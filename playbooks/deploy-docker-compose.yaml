- hosts: all
  become: true
  vars:
    target_path: /home/azureuser/app
    local_compose_file: ../docker-compose/docker-compose.yml

  tasks:

    - name: 📁 สร้างโฟลเดอร์ปลายทางถ้ายังไม่มี
      file:
        path: "{{ target_path }}"
        state: directory
        owner: azureuser
        group: azureuser
        mode: '0755'

    - name: 📦 Copy docker-compose.yml ไปยังเครื่องเป้าหมาย
      copy:
        src: "{{ local_compose_file }}"
        dest: "{{ target_path }}/docker-compose.yml"
        owner: azureuser
        group: azureuser
        mode: '0644'

    - name: 🐳 รัน docker compose up -d
      become: true
      become_user: azureuser
      shell: docker compose -f docker-compose.yml up -d
      args:
        chdir: "{{ target_path }}"
