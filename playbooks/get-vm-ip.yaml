- name: 🌐 ดึง Public IP ของ Azure VM
  hosts: localhost
  connection: local
  vars_files:
    - ../config/config-dev.yaml

  tasks:
    - name: 🔍 ค้นหา Public IP ของ VM
      azure.azcollection.azure_rm_publicipaddress_info:
        resource_group: "{{ resource_group }}"
        name: "{{ public_ip_name }}"
      register: public_ip_info

    - name: 🧹 ลบไฟล์ IP เก่าถ้ามี
      file:
        path: ./vm_ip.txt
        state: absent

    - name: 📝 บันทึก IP ลงไฟล์
      copy:
        dest: ./vm_ip.txt
        content: "{{ public_ip_info.publicipaddresses[0].ip_address }}"
